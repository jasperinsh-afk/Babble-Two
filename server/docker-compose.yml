services:
  app:
    build: .
    container_name: goqd-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://goqd:goqd_pass@db:5432/goqd
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./admin-web:/app/admin-web
    ports:
      - "8000:8000"

  celery_worker:
    build: .
    container_name: goqd-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://goqd:goqd_pass@db:5432/goqd
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      APP_ENV: production
    command: celery -A app.tasks.celery_app:celery_app worker -l info
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: goqd-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://goqd:goqd_pass@db:5432/goqd
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      APP_ENV: production
    command: celery -A app.tasks.celery_app:celery_app beat -l info
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: goqd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: goqd
      POSTGRES_PASSWORD: goqd_pass
      POSTGRES_DB: goqd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goqd"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goqd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
