# Nixpacks 构建配置（Railway 部署用）
#
# 为什么需要这个文件：
# 仓库根没有 requirements.txt / pyproject.toml（Python 依赖在 server/ 子目录），
# Nixpacks 探测不到 Python 项目，只会给一个 Ubuntu 基础镜像，构建时报 "pip: command not found"。
# 这里显式声明 python provider，并指定实际的安装与启动命令。
providers = ["python"]

[phases.install]
cmds = ["pip install -r server/requirements.txt"]

[start]
cmd = "cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
