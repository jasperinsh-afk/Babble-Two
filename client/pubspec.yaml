name: goqd_app
description: "七德通 GoQD —— 面向七宝德怀特高中在校生的校园生活入口型 App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络
  dio: ^5.9.0

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由（含 Deep Link）
  go_router: ^18.0.2

  # 本地存储
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # NFC（OMEGA）
  nfc_manager: ^4.0.1

  # Deep Link / Universal Links
  app_links: ^6.4.0

  # 图表（投票结果饼图 / 柱状图）
  fl_chart: ^1.0.0

  # 图片缓存
  cached_network_image: ^3.4.1

  # 日历
  table_calendar: ^3.2.0

  # 国际化 / 日期格式化
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
